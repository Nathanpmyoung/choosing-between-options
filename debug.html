<!DOCTYPE html>
<html>
<head>
    <title>Debug Poll Data</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Poll Data Debug</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        const pollId = new URLSearchParams(window.location.search).get('poll');

        output.innerHTML = '<h2>Poll ID from URL: ' + (pollId || 'NONE') + '</h2>';

        // Show all poll data
        const allPolls = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('poll_')) {
                try {
                    allPolls[key] = JSON.parse(localStorage.getItem(key));
                } catch(e) {
                    allPolls[key] = 'ERROR: ' + e.message;
                }
            }
        }

        output.innerHTML += '<h2>All Polls in localStorage:</h2><pre>' +
            JSON.stringify(allPolls, null, 2) + '</pre>';

        if (pollId) {
            const pollData = JSON.parse(localStorage.getItem(`poll_${pollId}`));
            output.innerHTML += '<h2>Current Poll Data:</h2><pre>' +
                JSON.stringify(pollData, null, 2) + '</pre>';

            if (pollData && pollData.participants) {
                output.innerHTML += '<h2>Participants (' + pollData.participants.length + '):</h2>';
                pollData.participants.forEach((p, i) => {
                    output.innerHTML += `<p>${i + 1}. ${p.name} - Enabled: ${p.enabled} - ${p.ranking?.length || 0} options ranked</p>`;
                });
            }
        }
    </script>
</body>
</html>
