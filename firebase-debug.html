<!DOCTYPE html>
<html>
<head>
    <title>Firebase Data Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            cursor: pointer;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #5568d3;
        }
        .danger {
            background: #f44336;
        }
        .danger:hover {
            background: #da190b;
        }
        .poll-item {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            font-family: monospace;
        }
        textarea {
            min-height: 200px;
        }
    </style>
</head>
<body>
    <h1>Firebase Data Debug Tool</h1>

    <div id="status" style="padding: 10px; margin: 10px 0; border-radius: 4px;"></div>

    <div style="margin: 20px 0;">
        <button onclick="loadAllPolls()">Refresh All Polls</button>
        <button onclick="exportAllData()" style="background: #4CAF50;">Export All Data (JSON)</button>
        <button class="danger" onclick="confirmClearAll()">Clear All Data</button>
    </div>

    <h2>All Polls in Firebase:</h2>
    <div id="polls"></div>

    <h2>Import/Edit Poll Data:</h2>
    <p>Paste poll JSON below to create/update a poll:</p>
    <textarea id="importData" placeholder='{"pollId": "...", "options": [...], "participants": [...]}'></textarea>
    <button onclick="importPoll()">Import/Update Poll</button>

    <!-- Firebase scripts -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDoxEzBXioh9Jy2yhSn55jG9R-C2aTZmlo",
            authDomain: "choosing-between-options.firebaseapp.com",
            projectId: "choosing-between-options",
            storageBucket: "choosing-between-options.firebasestorage.app",
            messagingSenderId: "301300074341",
            appId: "1:301300074341:web:1a1cfb50ca071f6f52f74f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Make Firestore available globally
        window.db = db;
        window.firestoreFunctions = { collection, getDocs, doc, getDoc, setDoc, deleteDoc };

        showStatus('Firebase connected successfully', 'success');

        // Auto-load on page load
        loadAllPolls();
    </script>

    <script>
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.background = type === 'success' ? '#d4edda' :
                                      type === 'error' ? '#f8d7da' :
                                      '#d1ecf1';
            status.style.color = type === 'success' ? '#155724' :
                                 type === 'error' ? '#721c24' :
                                 '#0c5460';
        }

        async function loadAllPolls() {
            try {
                showStatus('Loading polls from Firebase...', 'info');
                const { collection, getDocs } = window.firestoreFunctions;
                const pollsCollection = collection(window.db, 'polls');
                const snapshot = await getDocs(pollsCollection);

                const pollsDiv = document.getElementById('polls');

                if (snapshot.empty) {
                    pollsDiv.innerHTML = '<p>No polls found in Firebase.</p>';
                    showStatus('No polls found', 'info');
                    return;
                }

                let html = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const participantCount = data.participants ? data.participants.length : 0;
                    const optionCount = data.options ? data.options.length : 0;

                    html += `
                        <div class="poll-item">
                            <h3>Poll ID: ${doc.id}</h3>
                            <p><strong>Options:</strong> ${optionCount}</p>
                            <p><strong>Participants:</strong> ${participantCount}</p>
                            <p><strong>Created:</strong> ${data.created || 'Unknown'}</p>
                            <details>
                                <summary>View Full Data</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                            <button onclick="editPoll('${doc.id}')">Edit</button>
                            <button class="danger" onclick="deletePoll('${doc.id}')">Delete</button>
                            <button onclick="downloadPoll('${doc.id}')" style="background: #4CAF50;">Download JSON</button>
                        </div>
                    `;
                });

                pollsDiv.innerHTML = html;
                showStatus(`Loaded ${snapshot.size} poll(s) successfully`, 'success');
            } catch (error) {
                showStatus('Error loading polls: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        async function editPoll(pollId) {
            try {
                const { doc, getDoc } = window.firestoreFunctions;
                const pollDoc = doc(window.db, 'polls', pollId);
                const snapshot = await getDoc(pollDoc);

                if (snapshot.exists()) {
                    const data = snapshot.data();
                    document.getElementById('importData').value = JSON.stringify(data, null, 2);
                    window.scrollTo(0, document.body.scrollHeight);
                    showStatus('Poll loaded into editor. Modify and click Import/Update Poll to save.', 'info');
                }
            } catch (error) {
                showStatus('Error loading poll: ' + error.message, 'error');
            }
        }

        async function deletePoll(pollId) {
            if (!confirm(`Are you sure you want to delete poll "${pollId}"? This cannot be undone!`)) {
                return;
            }

            try {
                const { doc, deleteDoc } = window.firestoreFunctions;
                const pollDoc = doc(window.db, 'polls', pollId);
                await deleteDoc(pollDoc);
                showStatus(`Poll "${pollId}" deleted successfully`, 'success');
                loadAllPolls();
            } catch (error) {
                showStatus('Error deleting poll: ' + error.message, 'error');
            }
        }

        async function importPoll() {
            try {
                const jsonText = document.getElementById('importData').value.trim();
                if (!jsonText) {
                    showStatus('Please paste poll JSON data first', 'error');
                    return;
                }

                const data = JSON.parse(jsonText);

                if (!data.options || !Array.isArray(data.options)) {
                    showStatus('Invalid poll data: missing options array', 'error');
                    return;
                }

                const pollId = data.pollId || prompt('Enter poll ID:');
                if (!pollId) {
                    showStatus('Poll ID required', 'error');
                    return;
                }

                const { doc, setDoc } = window.firestoreFunctions;
                const pollDoc = doc(window.db, 'polls', pollId);

                // Ensure required fields
                const pollData = {
                    ...data,
                    created: data.created || new Date().toISOString(),
                    participants: data.participants || []
                };

                await setDoc(pollDoc, pollData);
                showStatus(`Poll "${pollId}" saved successfully`, 'success');
                document.getElementById('importData').value = '';
                loadAllPolls();
            } catch (error) {
                showStatus('Error importing poll: ' + error.message, 'error');
            }
        }

        async function downloadPoll(pollId) {
            try {
                const { doc, getDoc } = window.firestoreFunctions;
                const pollDoc = doc(window.db, 'polls', pollId);
                const snapshot = await getDoc(pollDoc);

                if (snapshot.exists()) {
                    const data = snapshot.data();
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `poll_${pollId}_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showStatus('Poll downloaded', 'success');
                }
            } catch (error) {
                showStatus('Error downloading poll: ' + error.message, 'error');
            }
        }

        async function exportAllData() {
            try {
                const { collection, getDocs } = window.firestoreFunctions;
                const pollsCollection = collection(window.db, 'polls');
                const snapshot = await getDocs(pollsCollection);

                const allPolls = {};
                snapshot.forEach((doc) => {
                    allPolls[doc.id] = doc.data();
                });

                const blob = new Blob([JSON.stringify(allPolls, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `all_polls_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showStatus('All data exported', 'success');
            } catch (error) {
                showStatus('Error exporting data: ' + error.message, 'error');
            }
        }

        function confirmClearAll() {
            const confirmation = prompt('Type "DELETE ALL" to confirm clearing all Firebase data:');
            if (confirmation === 'DELETE ALL') {
                clearAllData();
            } else {
                showStatus('Clear cancelled', 'info');
            }
        }

        async function clearAllData() {
            try {
                const { collection, getDocs, deleteDoc, doc } = window.firestoreFunctions;
                const pollsCollection = collection(window.db, 'polls');
                const snapshot = await getDocs(pollsCollection);

                let deleteCount = 0;
                for (const docSnapshot of snapshot.docs) {
                    await deleteDoc(doc(window.db, 'polls', docSnapshot.id));
                    deleteCount++;
                }

                showStatus(`Deleted ${deleteCount} poll(s) from Firebase`, 'success');
                loadAllPolls();
            } catch (error) {
                showStatus('Error clearing data: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
