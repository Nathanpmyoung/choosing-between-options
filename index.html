<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank by Pairs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .help-text {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        button.secondary:hover {
            background: #e0e0e0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .comparison-container {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .option-card {
            flex: 1;
            min-width: 250px;
            padding: 40px 30px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }

        .option-card:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: scale(1.05);
        }

        .option-card h3 {
            font-size: 1.5rem;
            color: #333;
        }

        .progress {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .ranking-list {
            list-style: none;
            margin: 20px 0;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .rank-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            margin-right: 15px;
            min-width: 40px;
        }

        .rank-name {
            font-size: 1.1rem;
            color: #333;
            flex: 1;
        }

        .rank-score {
            color: #888;
            font-size: 0.9rem;
        }

        .participant-toggle {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .participant-toggle input[type="checkbox"] {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .participant-toggle label {
            cursor: pointer;
            flex: 1;
            font-size: 1rem;
        }

        .section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .section-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
        }

        .start-over {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }

        .start-over:hover {
            color: #764ba2;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .option-card {
                min-width: 100%;
            }

            .comparison-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Screen 1: Welcome & Name Input -->
        <div id="nameScreen" class="screen active">
            <h1>Rank by Pairs</h1>
            <p class="subtitle">Make decisions through pairwise comparisons</p>
            <input type="text" id="nameInput" placeholder="Enter your name" />
            <button onclick="startSetup()">Get Started</button>
        </div>

        <!-- Screen 2: Options Setup -->
        <div id="setupScreen" class="screen">
            <h1>Setup Options</h1>
            <p class="subtitle">Enter the options you want to rank</p>
            <textarea id="optionsInput" placeholder="Enter each option on a new line&#10;&#10;Example:&#10;Option A&#10;Option B&#10;Option C"></textarea>
            <p class="help-text">Enter each option on a separate line</p>
            <div class="button-group">
                <button class="secondary" onclick="goToNameScreen()">Back</button>
                <button onclick="startComparisons()">Start Ranking</button>
            </div>
        </div>

        <!-- Screen 3: Pairwise Comparisons -->
        <div id="comparisonScreen" class="screen">
            <h1>Choose Your Preference</h1>
            <div class="progress" id="progressText"></div>
            <div class="comparison-container">
                <div class="option-card" onclick="selectOption(0)">
                    <h3 id="option1"></h3>
                </div>
                <div class="option-card" onclick="selectOption(1)">
                    <h3 id="option2"></h3>
                </div>
            </div>
            <button class="secondary" onclick="skipComparison()">Skip This Pair</button>
        </div>

        <!-- Screen 4: Individual Results -->
        <div id="resultsScreen" class="screen">
            <h1>Your Rankings</h1>
            <p class="subtitle" id="participantName"></p>
            <ol class="ranking-list" id="individualRanking"></ol>

            <div class="section">
                <h2 class="section-title">Group Rankings</h2>
                <div id="participantToggles"></div>
                <ol class="ranking-list" id="groupRanking"></ol>
            </div>

            <div class="button-group">
                <button class="secondary" onclick="exportData()">Export Data</button>
                <button onclick="addAnotherParticipant()">Add Another Participant</button>
            </div>
            <span class="start-over" onclick="startOver()">Start Over</span>
        </div>
    </div>

    <script>
        // Global state
        let currentParticipant = '';
        let options = [];
        let comparisons = [];
        let currentPairIndex = 0;
        let pairs = [];
        let allParticipants = JSON.parse(localStorage.getItem('participants')) || [];

        // Screen navigation
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startSetup() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            currentParticipant = name;
            showScreen('setupScreen');
        }

        function goToNameScreen() {
            showScreen('nameScreen');
        }

        function startComparisons() {
            const optionsText = document.getElementById('optionsInput').value.trim();
            if (!optionsText) {
                alert('Please enter at least 2 options');
                return;
            }

            options = optionsText.split('\n')
                .map(o => o.trim())
                .filter(o => o.length > 0);

            if (options.length < 2) {
                alert('Please enter at least 2 options');
                return;
            }

            // Generate all pairs
            pairs = [];
            for (let i = 0; i < options.length; i++) {
                for (let j = i + 1; j < options.length; j++) {
                    pairs.push([i, j]);
                }
            }

            // Shuffle pairs for variety
            pairs.sort(() => Math.random() - 0.5);

            comparisons = [];
            currentPairIndex = 0;

            showScreen('comparisonScreen');
            showNextPair();
        }

        function showNextPair() {
            if (currentPairIndex >= pairs.length) {
                calculateResults();
                return;
            }

            const [idx1, idx2] = pairs[currentPairIndex];
            document.getElementById('option1').textContent = options[idx1];
            document.getElementById('option2').textContent = options[idx2];
            document.getElementById('progressText').textContent =
                `Comparison ${currentPairIndex + 1} of ${pairs.length}`;
        }

        function selectOption(choice) {
            const [idx1, idx2] = pairs[currentPairIndex];
            const winner = choice === 0 ? idx1 : idx2;
            const loser = choice === 0 ? idx2 : idx1;

            comparisons.push({ winner, loser });
            currentPairIndex++;
            showNextPair();
        }

        function skipComparison() {
            currentPairIndex++;
            showNextPair();
        }

        function calculateResults() {
            // Calculate Elo-style ratings
            const ratings = new Array(options.length).fill(1000);
            const K = 32; // Elo K-factor

            comparisons.forEach(({ winner, loser }) => {
                const expectedWinner = 1 / (1 + Math.pow(10, (ratings[loser] - ratings[winner]) / 400));
                const expectedLoser = 1 / (1 + Math.pow(10, (ratings[winner] - ratings[loser]) / 400));

                ratings[winner] += K * (1 - expectedWinner);
                ratings[loser] += K * (0 - expectedLoser);
            });

            // Create ranking
            const ranking = options.map((option, idx) => ({
                option,
                rating: Math.round(ratings[idx])
            })).sort((a, b) => b.rating - a.rating);

            // Save participant data
            const participantData = {
                name: currentParticipant,
                timestamp: new Date().toISOString(),
                options: options,
                comparisons: comparisons,
                ranking: ranking,
                enabled: true
            };

            // Remove any existing data for this participant with same options
            allParticipants = allParticipants.filter(p =>
                p.name !== currentParticipant ||
                JSON.stringify(p.options.sort()) !== JSON.stringify(options.sort())
            );

            allParticipants.push(participantData);
            localStorage.setItem('participants', JSON.stringify(allParticipants));

            showResults();
        }

        function showResults() {
            // Find current participant's data
            const currentData = allParticipants.find(p =>
                p.name === currentParticipant &&
                JSON.stringify(p.options.sort()) === JSON.stringify(options.sort())
            );

            // Show individual ranking
            document.getElementById('participantName').textContent = `${currentParticipant}'s Rankings`;
            const individualList = document.getElementById('individualRanking');
            individualList.innerHTML = currentData.ranking.map((item, idx) => `
                <li class="ranking-item">
                    <span class="rank-number">${idx + 1}</span>
                    <span class="rank-name">${item.option}</span>
                    <span class="rank-score">${item.rating}</span>
                </li>
            `).join('');

            // Show participant toggles
            const relevantParticipants = allParticipants.filter(p =>
                JSON.stringify(p.options.sort()) === JSON.stringify(options.sort())
            );

            const togglesDiv = document.getElementById('participantToggles');
            togglesDiv.innerHTML = relevantParticipants.map((p, idx) => `
                <div class="participant-toggle">
                    <input type="checkbox" id="participant-${idx}"
                           ${p.enabled ? 'checked' : ''}
                           onchange="toggleParticipant('${p.name}')">
                    <label for="participant-${idx}">${p.name}</label>
                </div>
            `).join('');

            updateGroupRanking();
            showScreen('resultsScreen');
        }

        function toggleParticipant(name) {
            const participant = allParticipants.find(p =>
                p.name === name &&
                JSON.stringify(p.options.sort()) === JSON.stringify(options.sort())
            );
            if (participant) {
                participant.enabled = !participant.enabled;
                localStorage.setItem('participants', JSON.stringify(allParticipants));
                updateGroupRanking();
            }
        }

        function updateGroupRanking() {
            const relevantParticipants = allParticipants.filter(p =>
                JSON.stringify(p.options.sort()) === JSON.stringify(options.sort()) &&
                p.enabled
            );

            if (relevantParticipants.length === 0) {
                document.getElementById('groupRanking').innerHTML =
                    '<li style="text-align: center; color: #888;">No participants selected</li>';
                return;
            }

            // Average rankings across participants
            const aggregateRatings = {};
            options.forEach(option => {
                aggregateRatings[option] = 0;
            });

            relevantParticipants.forEach(p => {
                p.ranking.forEach(item => {
                    aggregateRatings[item.option] += item.rating;
                });
            });

            const groupRanking = Object.entries(aggregateRatings)
                .map(([option, totalRating]) => ({
                    option,
                    avgRating: Math.round(totalRating / relevantParticipants.length)
                }))
                .sort((a, b) => b.avgRating - a.avgRating);

            const groupList = document.getElementById('groupRanking');
            groupList.innerHTML = groupRanking.map((item, idx) => `
                <li class="ranking-item">
                    <span class="rank-number">${idx + 1}</span>
                    <span class="rank-name">${item.option}</span>
                    <span class="rank-score">Avg: ${item.avgRating}</span>
                </li>
            `).join('');
        }

        function addAnotherParticipant() {
            document.getElementById('nameInput').value = '';
            document.getElementById('optionsInput').value = options.join('\n');
            currentParticipant = '';
            showScreen('nameScreen');
        }

        function exportData() {
            const relevantParticipants = allParticipants.filter(p =>
                JSON.stringify(p.options.sort()) === JSON.stringify(options.sort())
            );

            const dataStr = JSON.stringify(relevantParticipants, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'rankings-export.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function startOver() {
            if (confirm('This will clear all data and start fresh. Continue?')) {
                localStorage.removeItem('participants');
                allParticipants = [];
                document.getElementById('nameInput').value = '';
                document.getElementById('optionsInput').value = '';
                currentParticipant = '';
                showScreen('nameScreen');
            }
        }
    </script>
</body>
</html>
